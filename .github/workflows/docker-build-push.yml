name: Build & Push Plain Java Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile Java (no Maven)
        run: |
          mkdir -p out/production/skill-exchange-system
          javac -d out/production/skill-exchange-system $(find src -name "*.java")

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            tochratana/skill-exchange-system:latest
            tochratana/skill-exchange-system:${{ github.run_number }}
